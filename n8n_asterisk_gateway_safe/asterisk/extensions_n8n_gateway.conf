[n8n-gateway-call]
exten => s,1,NoOp(n8n gateway call session=${N8N_SESSION_ID} phone=${N8N_PHONE})
 same => n,Answer()
 same => n,AGI(n8n_gateway_agi.py,${N8N_SESSION_ID},${N8N_GATEWAY_BASE_URL})
 same => n,Hangup()

exten => h,1,NoOp(n8n gateway hangup session=${N8N_SESSION_ID})
 same => n,AGI(n8n_gateway_finalize.py,${N8N_SESSION_ID},${N8N_GATEWAY_BASE_URL})
